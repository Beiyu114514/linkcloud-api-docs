# docs.linkcloud.sh -> Mintlify 托管地址
#
# 用法：
#   1. 把所有的 SUB.mintlify.site 换成你的 Mintlify 子域（mint status 会显示）。
#   2. 放到 /etc/nginx/conf.d/ 或 sites-available/ 下，reload nginx。
#   3. 证书可以用 certbot 签发，注意保留下面 ACME 校验的 location。
#
# 要点：
#   - Host 要设成上游主机名，不要透传原始 Host。
#   - 转发全部 HTTP 方法（分析上报是 POST）。
#   - 不缓存页面，只缓存 /mintlify-assets/_next/static/。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.linkcloud.sh;

    ssl_certificate     /etc/letsencrypt/live/docs.linkcloud.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.linkcloud.sh/privkey.pem;

    # ACME 校验不要被代理改写
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 静态资源可以长缓存
    location ^~ /mintlify-assets/_next/static/ {
        proxy_pass https://SUB.mintlify.site;
        proxy_ssl_server_name on;

        proxy_set_header Host SUB.mintlify.site;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;

        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass https://SUB.mintlify.site;
        proxy_ssl_server_name on;

        # 不要透传原始 Host
        proxy_set_header Host SUB.mintlify.site;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;

        # 长连接与流式响应
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;

        # 上游若返回指向上游域名的重定向，改回正式域名
        proxy_redirect https://SUB.mintlify.site/ https://docs.linkcloud.sh/;

        # 页面不缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.linkcloud.sh;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
