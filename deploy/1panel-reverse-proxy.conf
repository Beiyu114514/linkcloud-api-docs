# 1Panel 反向代理：docs.linkcloud.sh -> https://linkcloud-api.mintlify.site
# 线上实际配置：/opt/1panel/www/sites/docs.linkcloud.sh/proxy/root.conf
#
# 操作路径（1Panel v2.4.x）：
#   网站 → 创建网站 → 反向代理，域名 docs.linkcloud.sh，
#     代理地址 https://linkcloud-api.mintlify.site
#   → 配置 → HTTPS：选已上传的 *.linkcloud.sh 证书，开启强制 HTTPS
#   → 配置 → 反向代理：名称 root，匹配 /，发送域名 linkcloud-api.mintlify.site，SNI 开，缓存关
#   → 配置 → 配置文件：确认 include /www/sites/docs.linkcloud.sh/proxy/*.conf 存在
#   → 保存并重载 OpenResty
#
# 注意：1Panel 生成的反向代理默认是下面这两行，必须改掉：
#     proxy_set_header Host $host;      # Mintlify 会按 Host 返回错误站点
#     proxy_ssl_name $proxy_host;       # 显式写死上游域名更稳
#
# 关键点：
#   1. Host 必须是上游域名。透传 docs.linkcloud.sh 会让 Mintlify 返回错误站点。
#   2. HTTPS 上游必须开 SNI，否则 TLS 握手或证书校验会失败。
#   3. 不要缓存页面；Mintlify 自己已经下发了 no-store。不要写 proxy_cache off 之外
#      的缓存指令，1Panel 的面板会把含 proxy_cache 的配置显示成“缓存开启”。
#   4. /.well-known/acme-challenge/ 由 1Panel 的 server 块单独处理（`^~` 前缀优先
#      于 include 的 location），不要代理走。

location ^~ / {
    proxy_pass https://linkcloud-api.mintlify.site;

    # 关键：Host 用上游域名，不要透传 $host
    proxy_set_header Host linkcloud-api.mintlify.site;

    # HTTPS 上游必须开启 SNI
    proxy_ssl_server_name on;
    proxy_ssl_name linkcloud-api.mintlify.site;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    # 上游若返回指向上游域名的重定向，改回正式域名
    proxy_redirect https://linkcloud-api.mintlify.site/ https://docs.linkcloud.sh/;

    # 不缓存、不缓冲
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
