# 1Panel 反向代理：docs.linkcloud.sh -> https://linkcloud-api.mintlify.site
#
# 操作路径（1Panel v1.x）：
#   网站 → 网站 → 创建网站 → 静态网站，域名填 docs.linkcloud.sh
#   → 申请 SSL（Let's Encrypt）并开启 HTTPS
#   → 配置 → 反向代理 → 添加反向代理
#        名称      mintlify-docs
#        代理地址  https://linkcloud-api.mintlify.site
#        发送域名  linkcloud-api.mintlify.site
#        缓存      关闭
#   → 配置 → 配置文件，确认最终包含下面这段（重点是 proxy_ssl_server_name）
#
# 关键点：
#   1. Host 必须是上游域名。透传 docs.linkcloud.sh 会让 Mintlify 返回错误站点。
#   2. HTTPS 上游必须开 SNI，否则 TLS 握手或证书校验会失败。
#   3. 不要缓存页面；Mintlify 自己已经下发了 no-store。
#   4. /.well-known/acme-challenge/ 必须留在本地，否则证书续期会失败。

location ^~ / {
    proxy_pass https://linkcloud-api.mintlify.site;

    # 关键：Host 用上游域名，不要透传 $host
    proxy_set_header Host linkcloud-api.mintlify.site;

    # HTTPS 上游必须开启 SNI
    proxy_ssl_server_name on;
    proxy_ssl_name linkcloud-api.mintlify.site;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_http_version 1.1;

    # 上游若返回指向上游域名的重定向，改回正式域名
    proxy_redirect https://linkcloud-api.mintlify.site/ https://docs.linkcloud.sh/;

    # 不缓存，长连接关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 如果 1Panel 没有自动生成 ACME 校验的 location，补上这一段。
# 路径按实际网站根目录调整（1Panel 默认在 www/sites/<域名>/index 下）。
#
# location ^~ /.well-known/acme-challenge/ {
#     root /opt/1panel/apps/openresty/openresty/www/sites/docs.linkcloud.sh/index;
# }
